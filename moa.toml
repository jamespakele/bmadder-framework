[aggregator]
provider = "ollama"
model = "glm-5.2:cloud"
# skill = ".agents/skills/bmad-create-epics-and-stories"
# When set, the aggregator performs a two-phase prompt:
#   Phase 1: synthesize advisor outputs (always)
#   Phase 2: apply the skill to produce the final deliverable (when skill is set)
# The --skill CLI flag overrides this at runtime.

[[reference]]
provider = "ollama"
model = "nemotron-3-super:cloud"
label = "nemotron"

[[reference]]
provider = "ollama"
model = "qwen3.5:397b-cloud"
label = "qwen35"

[[reference]]
provider = "ollama"
model = "deepseek-v4-flash:cloud"
label = "deepseek-v4-flash"

[[reference]]
provider = "ollama"
model = "minimax-m3:cloud"
label = "minimax-m3"

[pi]
install_method = "npm"
backend = "rig"
timeout_secs = 360
reference_thinking = "low"

[synthesis]
temperature = 0.4
max_tokens = 4096
output_dir = "./output"
max_rounds = 0
bmad_compatible = false
bmad_config_path = "_bmad/bmm/config.yaml"
